name: CI Verification & Rules Suite

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Lint, Unit/Regression Tests, Build & Firestore Rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21 (Required for Firestore Emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check (lint)
        run: npm run lint

      - name: Run unit, behavioral & regression tests
        run: npm test

      - name: Build production client and server bundles
        run: npm run build

      - name: Run Firestore Security Rules Emulator Suite
        run: npx -y firebase-tools@15.36.0 emulators:exec --only firestore "npx tsx tests/firestore-rules.test.ts"
